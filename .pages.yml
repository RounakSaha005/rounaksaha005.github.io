# Pages CMS Configuration
# Documentation: https://pagescms.org/docs/

# Media Uploads Configuration
# Every uploaded image from the Pages CMS media manager or content fields
# is saved into `input` (in Git) and referenced by `output` (public URL).
media:
  input: src/assets/images
  output: /assets/images
  categories: [image]
  rename: safe

content:
  # Blog Posts Collection
  - name: posts
    label: Blog Posts
    type: collection
    path: src/posts
    format: yaml-frontmatter
    exclude: [posts.json, index.njk]
    filename: "{year}-{month}-{day}-{slug}.md"
    view:
      primary: title
      sort: [date]
      order: desc
    fields:
      - name: title
        label: Post Title
        type: string
        required: true
      - name: description
        label: Excerpt / Meta Description
        type: text
      - name: date
        label: Published Date
        type: date
        default: now
      - name: image
        label: Featured Image
        type: image
        description: Cover image for this post and Open Graph cards
      - name: tags
        label: Tags
        type: list
        list: string
      - name: body
        label: Post Content
        type: rich-text

  # Featured YouTube Videos Collection
  - name: youtube
    label: YouTube Videos
    type: file
    path: src/_data/youtube.json
    fields:
      - name: videos
        label: Video List
        type: list
        fields:
          - name: title
            label: Video Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
          - name: thumbnail
            label: Video Thumbnail Image
            type: image
          - name: duration
            label: Duration (e.g. 24:10)
            type: string
          - name: views
            label: Views Count
            type: string
          - name: url
            label: YouTube Video URL
            type: string
          - name: tag
            label: Category Tag
            type: string

  # Developer Photos Gallery
  - name: photos
    label: Photo Gallery
    type: file
    path: src/_data/photos.json
    fields:
      - name: gallery
        label: Photo Items
        type: list
        fields:
          - name: title
            label: Photo Title
            type: string
            required: true
          - name: category
            label: Category (Setup, Speaking, Community, Travel)
            type: string
          - name: location
            label: Location
            type: string
          - name: date
            label: Year / Date
            type: string
          - name: image
            label: Upload Photo
            type: image
          - name: description
            label: Caption
            type: text

  # Friends & Blogroll
  - name: friends
    label: Friends & Blogroll
    type: file
    path: src/_data/friends.json
    fields:
      - name: peers
        label: Friend List
        type: list
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: role
            label: Role & Company
            type: string
          - name: url
            label: Personal Website URL
            type: string
          - name: avatar
            label: Avatar Image
            type: image
          - name: bio
            label: Short Bio
            type: text

  # Projects Portfolio
  - name: projects
    label: Projects
    type: file
    path: src/_data/projects.json
    fields:
      - name: projectList
        label: Projects
        type: list
        fields:
          - name: title
            label: Project Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
          - name: year
            label: Year
            type: string
          - name: status
            label: Status (Production, Open Source, Shipped)
            type: string
          - name: github
            label: GitHub URL
            type: string
          - name: link
            label: Live URL
            type: string

  # Global Site Configuration & Metadata
  - name: settings
    label: Site Settings
    type: file
    path: src/_data/site.json
    fields:
      - name: name
        label: Site Name
        type: string
        required: true
      - name: title
        label: Browser Title
        type: string
      - name: description
        label: Site Description
        type: text
      - name: url
        label: Production URL
        type: string
      - name: avatar
        label: Avatar / Logo Image
        type: image
        description: Upload your personal avatar or logo
      - name: author
        label: Author Info
        type: object
        fields:
          - name: name
            label: Author Name
            type: string
          - name: email
            label: Email Address
            type: string
          - name: github
            label: GitHub Profile URL
            type: string
          - name: linkedin
            label: LinkedIn Profile URL
            type: string
          - name: youtube
            label: YouTube Channel URL
            type: string
      - name: navigation
        label: Navigation Menu
        type: list
        fields:
          - name: label
            label: Nav Label
            type: string
          - name: url
            label: Link URL
            type: string
