<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      :root {
        --bg: #141E28;
        --border: #2C353D;
        --color-r: #FCFBF7;
        --color-s: #2BBBD7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1A212D;
          --border: #36415A;
          --color-r: #FCFBF7;
          --color-s: #B7D894;
        }
      }
      .bg {
        fill: var(--bg);
        stroke: var(--border);
        stroke-width: 8;
      }
      .monogram {
        font-family: Bahnschrift, "DIN Alternate", "Franklin Gothic Medium", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 280px;
        letter-spacing: 0.02em;
        dominant-baseline: central;
        text-anchor: middle;
      }
      .char-r { fill: var(--color-r); }
      .char-s { fill: var(--color-s); }
    </style>
  </defs>

  <!-- Squircle Base with Subtle Border -->
  <rect class="bg" x="12" y="12" width="488" height="488" rx="112" />

  <!-- Monogram RS perfectly centered -->
  <text x="256" y="260" class="monogram">
    <tspan class="char-r">R</tspan><tspan class="char-s">S</tspan>
  </text>
</svg>
