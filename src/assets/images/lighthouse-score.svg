<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%" class="w-full h-auto rounded-xl">
  <!-- Canvas Background -->
  <rect width="960" height="280" fill="#0B0F17" rx="16"/>
  <rect width="958" height="278" x="1" y="1" fill="none" stroke="#334155" stroke-dasharray="4,4" stroke-width="1" rx="15"/>

  <!-- Title -->
  <g transform="translate(480, 36)" text-anchor="middle">
    <text y="0" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">Google Lighthouse Mobile Audit Scores</text>
    <text y="18" fill="#94A3B8" font-family="monospace" font-size="10">RECORDED ON PRODUCTION DOMAIN · ZERO ACCUMULATED DEBT</text>
  </g>

  <!-- Gauge 1: Performance -->
  <g transform="translate(140, 140)">
    <circle cx="0" cy="0" r="46" fill="#064E3B" fill-opacity="0.2" stroke="#10B981" stroke-width="5"/>
    <text x="0" y="8" fill="#34D399" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">100</text>
    <text x="0" y="70" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Performance</text>
    <text x="0" y="88" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">FCP 0.2s · LCP 0.3s</text>
  </g>

  <!-- Gauge 2: Accessibility -->
  <g transform="translate(365, 140)">
    <circle cx="0" cy="0" r="46" fill="#064E3B" fill-opacity="0.2" stroke="#10B981" stroke-width="5"/>
    <text x="0" y="8" fill="#34D399" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">100</text>
    <text x="0" y="70" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Accessibility</text>
    <text x="0" y="88" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">WCAG 2.2 AA compliant</text>
  </g>

  <!-- Gauge 3: Best Practices -->
  <g transform="translate(595, 140)">
    <circle cx="0" cy="0" r="46" fill="#064E3B" fill-opacity="0.2" stroke="#10B981" stroke-width="5"/>
    <text x="0" y="8" fill="#34D399" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">100</text>
    <text x="0" y="70" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Best Practices</text>
    <text x="0" y="88" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">Modern HTTPS &amp; CSP</text>
  </g>

  <!-- Gauge 4: SEO -->
  <g transform="translate(820, 140)">
    <circle cx="0" cy="0" r="46" fill="#064E3B" fill-opacity="0.2" stroke="#10B981" stroke-width="5"/>
    <text x="0" y="8" fill="#34D399" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">100</text>
    <text x="0" y="70" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SEO</text>
    <text x="0" y="88" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">Valid meta &amp; OpenGraph</text>
  </g>
</svg>

