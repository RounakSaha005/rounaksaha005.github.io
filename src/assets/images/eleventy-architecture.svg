<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" class="w-full h-auto rounded-xl">
  <!-- Canvas Background -->
  <rect width="960" height="420" fill="#0B0F17" rx="16"/>
  <rect width="958" height="418" x="1" y="1" fill="none" stroke="#334155" stroke-dasharray="4,4" stroke-width="1" rx="15"/>

  <!-- Title -->
  <g transform="translate(480, 42)" text-anchor="middle">
    <rect x="-170" y="-22" width="340" height="36" rx="18" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-width="1.5"/>
    <text y="2" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">STATIC GENERATION PIPELINE</text>
    <text y="30" fill="#94A3B8" font-family="sans-serif" font-size="12">Eleventy v3 Engine · Tailwind CSS v4 · daisyUI 5 · Sub-second Build</text>
  </g>

  <!-- Flow Steps -->
  <!-- Step 1: Content & Templates -->
  <g transform="translate(60, 100)">
    <rect width="230" height="230" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="18" y="18" width="80" height="22" rx="4" fill="#1E293B"/>
    <text x="58" y="33" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">01 / SOURCE</text>

    <text x="18" y="65" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Editorial Source</text>
    <text x="18" y="82" fill="#94A3B8" font-family="sans-serif" font-size="10">Markdown content &amp; Nunjucks layouts</text>

    <g transform="translate(18, 100)">
      <rect width="194" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-dasharray="2,2" stroke-width="1"/>
      <text x="12" y="18" fill="#E2E8F0" font-family="monospace" font-size="10">src/posts/*.md</text>

      <rect y="36" width="194" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-dasharray="2,2" stroke-width="1"/>
      <text x="12" y="54" fill="#E2E8F0" font-family="monospace" font-size="10">src/_includes/*.njk</text>

      <rect y="72" width="194" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-dasharray="2,2" stroke-width="1"/>
      <text x="12" y="90" fill="#E2E8F0" font-family="monospace" font-size="10">src/styles/index.css</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(305, 215)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="40,0 32,-5 32,5" fill="#38BDF8"/>
  </g>

  <!-- Step 2: Build Compiler -->
  <g transform="translate(365, 100)">
    <rect width="230" height="230" rx="12" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="18" y="18" width="90" height="22" rx="4" fill="#0284C7" fill-opacity="0.2"/>
    <text x="63" y="33" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">02 / COMPILER</text>

    <text x="18" y="65" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">11ty v3 + PostCSS</text>
    <text x="18" y="82" fill="#94A3B8" font-family="sans-serif" font-size="10">Zero JS hydration · lightning fast</text>

    <g transform="translate(18, 100)">
      <rect width="194" height="34" rx="6" fill="#1E293B"/>
      <text x="12" y="22" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">⚡ 0.72s Total Build</text>

      <rect y="42" width="194" height="30" rx="6" fill="#1E293B"/>
      <text x="12" y="62" fill="#94A3B8" font-family="monospace" font-size="9">Tailwind v4 @theme</text>

      <rect y="80" width="194" height="30" rx="6" fill="#1E293B"/>
      <text x="12" y="100" fill="#94A3B8" font-family="monospace" font-size="9">daisyUI 5 semantic tokens</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(610, 215)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#10B981" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="40,0 32,-5 32,5" fill="#10B981"/>
  </g>

  <!-- Step 3: Production Output -->
  <g transform="translate(670, 100)">
    <rect width="230" height="230" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <rect x="18" y="18" width="85" height="22" rx="4" fill="#064E3B" fill-opacity="0.4"/>
    <text x="60" y="33" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">03 / OUTPUT</text>

    <text x="18" y="65" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Pure Static Edge</text>
    <text x="18" y="82" fill="#94A3B8" font-family="sans-serif" font-size="10">Global CDN delivery ready</text>

    <g transform="translate(18, 100)">
      <rect width="194" height="34" rx="6" fill="#064E3B" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
      <text x="12" y="22" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">✓ 100/100 Lighthouse</text>

      <rect y="42" width="194" height="30" rx="6" fill="#1E293B"/>
      <text x="12" y="62" fill="#E2E8F0" font-family="monospace" font-size="9">&lt; 14kB gzipped CSS</text>

      <rect y="80" width="194" height="30" rx="6" fill="#1E293B"/>
      <text x="12" y="100" fill="#E2E8F0" font-family="monospace" font-size="9">0kB Client JS runtime</text>
    </g>
  </g>

  <!-- Bottom Metric Footer -->
  <g transform="translate(480, 375)" text-anchor="middle">
    <text fill="#34D399" font-family="monospace" font-size="11">✓ CRAFTED WITH ARCHITECTURAL CARE · NO SPA OVERHEAD · INSTANT PAGE RENDERS</text>
  </g>
</svg>
