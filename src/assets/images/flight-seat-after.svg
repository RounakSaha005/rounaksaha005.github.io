<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" class="w-full h-auto rounded-xl">
  <defs>
    <linearGradient id="phoneBgAfter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="100%" stop-color="#14181E" />
    </linearGradient>
    <linearGradient id="screenBgAfter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadowAfter" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#0B0F17" rx="16"/>
  <rect width="958" height="538" x="1" y="1" fill="none" stroke="#334155" stroke-dasharray="4,4" stroke-width="1" rx="15"/>

  <!-- Top Title Banner -->
  <g transform="translate(480, 42)" text-anchor="middle">
    <rect x="-170" y="-24" width="340" height="40" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
    <text y="3" fill="#34D399" font-family="'Brush Script MT', 'Caveat', cursive, sans-serif" font-size="28" font-weight="bold" letter-spacing="1">After — Solution</text>
    <text y="32" fill="#94A3B8" font-family="monospace" font-size="11" letter-spacing="0.5">FLUID CANVAS ARCHITECTURE &amp; MULTI-PASSENGER FLOW</text>
  </g>

  <!-- ================= PHONE 1: FLUID CANVAS SEAT MAP ================= -->
  <g transform="translate(110, 80)" filter="url(#shadowAfter)">
    <!-- Body -->
    <rect width="320" height="420" rx="28" fill="url(#phoneBgAfter)" stroke="#334155" stroke-width="2"/>
    <rect width="300" height="400" x="10" y="10" rx="20" fill="url(#screenBgAfter)"/>

    <!-- Status Bar -->
    <text x="28" y="32" fill="#94A3B8" font-family="monospace" font-size="10">02:14</text>
    <circle cx="270" cy="28" r="3" fill="#10B981"/>
    <text x="280" y="32" fill="#94A3B8" font-family="monospace" font-size="10">94%</text>

    <!-- Header with Breadcrumb Flow -->
    <rect x="22" y="44" width="276" height="34" rx="6" fill="#1E293B"/>
    <path d="M 32 61 L 40 54 M 32 61 L 40 68" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="58" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold">DEL → BOM (Flight 6E-204)</text>
    <text x="50" y="70" fill="#38BDF8" font-family="sans-serif" font-size="9">Airbus A320 · 2 Passengers</text>

    <!-- Passenger Selection Chips (Sync Indicator) -->
    <rect x="22" y="84" width="134" height="26" rx="13" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="34" cy="97" r="6" fill="#0284C7"/>
    <text x="46" y="101" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold">1. Rounak (12A)</text>

    <rect x="162" y="84" width="136" height="26" rx="13" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="174" cy="97" r="6" fill="#F59E0B"/>
    <text x="186" y="101" fill="#FBBF24" font-family="sans-serif" font-size="10" font-weight="bold">2. Priya (12B)</text>

    <!-- Canvas Cabin Visualization with Wing Roots -->
    <path d="M 18 200 L 36 210 L 36 260 L 18 280 Z" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <path d="M 302 200 L 284 210 L 284 260 L 302 280 Z" fill="#1E293B" stroke="#334155" stroke-width="1"/>

    <!-- Cabin Shell -->
    <rect x="36" y="116" width="248" height="242" rx="20" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Legend Bar -->
    <rect x="46" y="124" width="228" height="20" rx="4" fill="#1E293B"/>
    <rect x="52" y="129" width="10" height="10" rx="2" fill="#10B981"/>
    <text x="66" y="138" fill="#94A3B8" font-family="sans-serif" font-size="8">Extra Leg</text>
    <rect x="110" y="129" width="10" height="10" rx="2" fill="#38BDF8"/>
    <text x="124" y="138" fill="#94A3B8" font-family="sans-serif" font-size="8">Standard</text>
    <rect x="168" y="129" width="10" height="10" rx="2" fill="#334155"/>
    <text x="182" y="138" fill="#94A3B8" font-family="sans-serif" font-size="8">Free</text>
    <rect x="210" y="129" width="10" height="10" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="224" y="138" fill="#64748B" font-family="sans-serif" font-size="8">Taken</text>

    <!-- Column Letters -->
    <text x="66" y="158" fill="#64748B" font-family="monospace" font-size="9">A</text>
    <text x="96" y="158" fill="#64748B" font-family="monospace" font-size="9">B</text>
    <text x="126" y="158" fill="#64748B" font-family="monospace" font-size="9">C</text>
    <text x="160" y="158" fill="#38BDF8" font-family="monospace" font-size="8">AISLE</text>
    <text x="194" y="158" fill="#64748B" font-family="monospace" font-size="9">D</text>
    <text x="224" y="158" fill="#64748B" font-family="monospace" font-size="9">E</text>
    <text x="254" y="158" fill="#64748B" font-family="monospace" font-size="9">F</text>

    <!-- Row 11 -->
    <rect x="58" y="166" width="20" height="20" rx="3" fill="#38BDF8"/>
    <rect x="88" y="166" width="20" height="20" rx="3" fill="#38BDF8"/>
    <rect x="118" y="166" width="20" height="20" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="160" y="180" fill="#475569" font-family="monospace" font-size="9" text-anchor="middle">11</text>
    <rect x="186" y="166" width="20" height="20" rx="3" fill="#38BDF8"/>
    <rect x="216" y="166" width="20" height="20" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <rect x="246" y="166" width="20" height="20" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>

    <!-- Row 12 (SELECTED - Emergency Exit Extra Legroom) -->
    <rect x="44" y="192" width="232" height="28" rx="4" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-dasharray="2,2" stroke-width="1"/>
    
    <!-- Seat 12A (Selected by P1) -->
    <rect x="58" y="196" width="20" height="20" rx="4" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="68" y="209" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">P1</text>
    
    <!-- Seat 12B (Selected by P2) -->
    <rect x="88" y="196" width="20" height="20" rx="4" fill="#F59E0B" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="98" y="209" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">P2</text>
    
    <rect x="118" y="196" width="20" height="20" rx="3" fill="#10B981"/>
    <text x="160" y="210" fill="#10B981" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">12 XL</text>
    <rect x="186" y="196" width="20" height="20" rx="3" fill="#10B981"/>
    <rect x="216" y="196" width="20" height="20" rx="3" fill="#10B981"/>
    <rect x="246" y="196" width="20" height="20" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>

    <!-- Row 14 -->
    <rect x="58" y="228" width="20" height="20" rx="3" fill="#334155"/>
    <rect x="88" y="228" width="20" height="20" rx="3" fill="#334155"/>
    <rect x="118" y="228" width="20" height="20" rx="3" fill="#334155"/>
    <text x="160" y="242" fill="#475569" font-family="monospace" font-size="9" text-anchor="middle">14</text>
    <rect x="186" y="228" width="20" height="20" rx="3" fill="#38BDF8"/>
    <rect x="216" y="228" width="20" height="20" rx="3" fill="#38BDF8"/>
    <rect x="246" y="228" width="20" height="20" rx="3" fill="#38BDF8"/>

    <!-- Row 15 -->
    <rect x="58" y="254" width="20" height="20" rx="3" fill="#334155"/>
    <rect x="88" y="254" width="20" height="20" rx="3" fill="#334155"/>
    <rect x="118" y="254" width="20" height="20" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="160" y="268" fill="#475569" font-family="monospace" font-size="9" text-anchor="middle">15</text>
    <rect x="186" y="254" width="20" height="20" rx="3" fill="#334155"/>
    <rect x="216" y="254" width="20" height="20" rx="3" fill="#334155"/>
    <rect x="246" y="254" width="20" height="20" rx="3" fill="#334155"/>

    <!-- Floating Tooltip Card -->
    <g transform="translate(150, 280)">
      <rect width="124" height="42" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
      <text x="8" y="16" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="bold">Seat 12A · Extra Legroom</text>
      <text x="8" y="28" fill="#94A3B8" font-family="sans-serif" font-size="8">34" pitch · Free fast deplane</text>
      <text x="8" y="38" fill="#34D399" font-family="monospace" font-size="8" font-weight="bold">₹350 · Assigned to Rounak</text>
    </g>

    <!-- Bottom Action Bar (Fixed, Prominent) -->
    <rect x="22" y="364" width="276" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="34" y="381" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold">Seats: 12A, 12B</text>
    <text x="34" y="394" fill="#38BDF8" font-family="monospace" font-size="10">₹700 Total</text>
    <rect x="176" y="370" width="114" height="26" rx="6" fill="#0284C7"/>
    <text x="233" y="387" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Next Flight →</text>
  </g>

  <!-- ================= PHONE 2: MULTI-LEG PERSISTENT SUMMARY ================= -->
  <g transform="translate(530, 80)" filter="url(#shadowAfter)">
    <!-- Body -->
    <rect width="320" height="420" rx="28" fill="url(#phoneBgAfter)" stroke="#334155" stroke-width="2"/>
    <rect width="300" height="400" x="10" y="10" rx="20" fill="url(#screenBgAfter)"/>

    <!-- Status Bar -->
    <text x="28" y="32" fill="#94A3B8" font-family="monospace" font-size="10">02:16</text>
    <circle cx="270" cy="28" r="3" fill="#10B981"/>
    <text x="280" y="32" fill="#94A3B8" font-family="monospace" font-size="10">94%</text>

    <!-- Header -->
    <rect x="22" y="44" width="276" height="34" rx="6" fill="#1E293B"/>
    <path d="M 32 61 L 40 54 M 32 61 L 40 68" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="58" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold">BOM → GOI (Connecting Flight)</text>
    <text x="50" y="70" fill="#38BDF8" font-family="sans-serif" font-size="9">Airbus A320 · Leg 2 of 2</text>

    <!-- Stepper Tracker -->
    <rect x="22" y="86" width="276" height="48" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    
    <!-- Step 1 Complete -->
    <circle cx="44" cy="110" r="10" fill="#10B981"/>
    <path d="M 40 110 L 43 113 L 49 107" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="108" fill="#F8FAFC" font-family="sans-serif" font-size="10" font-weight="bold">DEL → BOM</text>
    <text x="60" y="119" fill="#10B981" font-family="sans-serif" font-size="8">Seats 12A, 12B ✓</text>

    <line x1="140" y1="110" x2="168" y2="110" stroke="#10B981" stroke-width="2"/>

    <!-- Step 2 In Progress -->
    <circle cx="186" cy="110" r="10" fill="#0284C7"/>
    <text x="186" y="113" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">2</text>
    <text x="202" y="108" fill="#F8FAFC" font-family="sans-serif" font-size="10" font-weight="bold">BOM → GOI</text>
    <text x="202" y="119" fill="#38BDF8" font-family="sans-serif" font-size="8">Selecting Now...</text>

    <!-- 1-Tap Auto Recommendation Card -->
    <rect x="22" y="142" width="276" height="88" rx="8" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1"/>
    <text x="34" y="160" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold">⚡ Smart Recommendation</text>
    <text x="34" y="174" fill="#E2E8F0" font-family="sans-serif" font-size="9">Matched your previous seats (14A Window &amp; 14B Middle):</text>
    <rect x="34" y="184" width="120" height="26" rx="4" fill="#0284C7"/>
    <text x="94" y="201" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">1-Tap Apply (₹300)</text>
    <text x="166" y="201" fill="#94A3B8" font-family="sans-serif" font-size="9">Or choose below ↓</text>

    <!-- Mini Seat Visual for Leg 2 -->
    <rect x="22" y="238" width="276" height="118" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="34" y="256" fill="#94A3B8" font-family="sans-serif" font-size="9">BOM → GOI Seat Availability (ATR-72 turboprop)</text>
    
    <!-- Row 1 ATR -->
    <rect x="68" y="266" width="18" height="18" rx="3" fill="#0284C7"/>
    <rect x="94" y="266" width="18" height="18" rx="3" fill="#F59E0B"/>
    <text x="160" y="279" fill="#475569" font-family="monospace" font-size="8" text-anchor="middle">1</text>
    <rect x="208" y="266" width="18" height="18" rx="3" fill="#334155"/>
    <rect x="234" y="266" width="18" height="18" rx="3" fill="#334155"/>

    <!-- Row 2 ATR -->
    <rect x="68" y="290" width="18" height="18" rx="3" fill="#334155"/>
    <rect x="94" y="290" width="18" height="18" rx="3" fill="#334155"/>
    <text x="160" y="303" fill="#475569" font-family="monospace" font-size="8" text-anchor="middle">2</text>
    <rect x="208" y="290" width="18" height="18" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <rect x="234" y="290" width="18" height="18" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>

    <text x="160" y="336" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">✓ Both flights completed in 38s</text>

    <!-- Bottom Done Action -->
    <rect x="22" y="364" width="276" height="38" rx="8" fill="#10B981"/>
    <text x="160" y="388" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Confirm Both Flights (₹1,000) →</text>
  </g>
</svg>
